services:
  control-api:
    build:
      context: ./control-api
    container_name: cdn-control-api
    ports:
      - "8070:8070"
    environment:
      CONTROL_TOKEN: ${CDN_CONTROL_TOKEN:***REDACTED***}
      CUSTOM_RULES_DIR: /src/custom-rules
    volumes:
      - ../modsecurity/custom-rules:/src/custom-rules:ro
      - cdn_control_data:/data
    restart: unless-stopped
    networks:
      - cdn-net

  edge-sg:
    image: owasp/modsecurity-crs:nginx
    container_name: cdn-edge-sg
    user: root
    ports:
      - "8081:80"
      - "8441:443"
    environment:
      EDGE_REGION: SG
      ORIGIN_HOST: ${CDN_ORIGIN_HOST:-dvwa}
      ORIGIN_PORT: ${CDN_ORIGIN_PORT:-80}
      PARANOIA: ${CDN_PARANOIA:-1}
      ANOMALY_INBOUND: ${CDN_ANOMALY_INBOUND:-10}
      ANOMALY_OUTBOUND: ${CDN_ANOMALY_OUTBOUND:-10}
      CONTROL_API_URL: http://cdn-control-api:8070
      SYNC_INTERVAL_SEC: ${CDN_SYNC_INTERVAL_SEC:-5}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS_SG:-30}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST_SG:-60}
      RATE_LIMIT_BURST_STATIC: ${RATE_LIMIT_BURST_STATIC_SG:-120}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./edge/templates/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./edge/templates/conf.d/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./edge/templates/modsecurity.d/setup.conf.template:/etc/nginx/templates/modsecurity.d/setup.conf.template:ro
      - ./edge/templates/modsecurity.d/modsecurity.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity.conf.template:ro
      - ./edge/templates/modsecurity.d/modsecurity-override.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      - ./edge/entrypoint.d/99-rulesync.sh:/docker-entrypoint.d/99-rulesync.sh:ro
      - edge_sg_rules:/opt/custom-rules
      - ./edge/html/429.html:/usr/share/nginx/html/429.html:ro
      - ./edge/ssl:/etc/nginx/ssl:ro
      - edge_sg_cache:/var/cache/nginx
      - ../logs/cdn/sg:/var/log/nginx/cdn
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      cdn-net:
        ipv4_address: 172.28.0.11
      waf-net:

  edge-jp:
    image: owasp/modsecurity-crs:nginx
    container_name: cdn-edge-jp
    user: root
    ports:
      - "8082:80"
      - "8442:443"
    environment:
      EDGE_REGION: JP
      ORIGIN_HOST: ${CDN_ORIGIN_HOST:-dvwa}
      ORIGIN_PORT: ${CDN_ORIGIN_PORT:-80}
      PARANOIA: ${CDN_PARANOIA:-1}
      ANOMALY_INBOUND: ${CDN_ANOMALY_INBOUND:-10}
      ANOMALY_OUTBOUND: ${CDN_ANOMALY_OUTBOUND:-10}
      CONTROL_API_URL: http://cdn-control-api:8070
      SYNC_INTERVAL_SEC: ${CDN_SYNC_INTERVAL_SEC:-5}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS_JP:-30}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST_JP:-60}
      RATE_LIMIT_BURST_STATIC: ${RATE_LIMIT_BURST_STATIC_JP:-120}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./edge/templates/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./edge/templates/conf.d/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./edge/templates/modsecurity.d/setup.conf.template:/etc/nginx/templates/modsecurity.d/setup.conf.template:ro
      - ./edge/templates/modsecurity.d/modsecurity.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity.conf.template:ro
      - ./edge/templates/modsecurity.d/modsecurity-override.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      - ./edge/entrypoint.d/99-rulesync.sh:/docker-entrypoint.d/99-rulesync.sh:ro
      - edge_jp_rules:/opt/custom-rules
      - ./edge/html/429.html:/usr/share/nginx/html/429.html:ro
      - ./edge/ssl:/etc/nginx/ssl:ro
      - edge_jp_cache:/var/cache/nginx
      - ../logs/cdn/jp:/var/log/nginx/cdn
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      cdn-net:
        ipv4_address: 172.28.0.12
      waf-net:

  edge-th:
    image: owasp/modsecurity-crs:nginx
    container_name: cdn-edge-th
    user: root
    ports:
      - "8086:80"
      - "8446:443"
    environment:
      EDGE_REGION: TH
      ORIGIN_HOST: ${CDN_ORIGIN_HOST:-dvwa}
      ORIGIN_PORT: ${CDN_ORIGIN_PORT:-80}
      PARANOIA: ${CDN_PARANOIA:-1}
      ANOMALY_INBOUND: ${CDN_ANOMALY_INBOUND:-10}
      ANOMALY_OUTBOUND: ${CDN_ANOMALY_OUTBOUND:-10}
      CONTROL_API_URL: http://cdn-control-api:8070
      SYNC_INTERVAL_SEC: ${CDN_SYNC_INTERVAL_SEC:-5}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS_TH:-50}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST_TH:-100}
      RATE_LIMIT_BURST_STATIC: ${RATE_LIMIT_BURST_STATIC_TH:-200}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./edge/templates/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./edge/templates/conf.d/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./edge/templates/modsecurity.d/setup.conf.template:/etc/nginx/templates/modsecurity.d/setup.conf.template:ro
      - ./edge/templates/modsecurity.d/modsecurity.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity.conf.template:ro
      - ./edge/templates/modsecurity.d/modsecurity-override.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      - ./edge/entrypoint.d/99-rulesync.sh:/docker-entrypoint.d/99-rulesync.sh:ro
      - edge_th_rules:/opt/custom-rules
      - ./edge/html/429.html:/usr/share/nginx/html/429.html:ro
      - ./edge/ssl:/etc/nginx/ssl:ro
      - edge_th_cache:/var/cache/nginx
      - ../logs/cdn/th:/var/log/nginx/cdn
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      cdn-net:
        ipv4_address: 172.28.0.13
      waf-net:

  geodns:
    build:
      context: ./geodns
    container_name: cdn-geodns
    environment:
      GEODNS_DOMAIN: ${GEODNS_DOMAIN:-cdn.local}
      GEODNS_DEFAULT_REGION: ${GEODNS_DEFAULT_REGION:-TH}
      EDGE_SG_IP: 172.28.0.11
      EDGE_JP_IP: 172.28.0.12
      EDGE_TH_IP: 172.28.0.13
      GEODNS_TTL: ${GEODNS_TTL:-20}
    ports:
      - "5533:53/udp"
      - "5533:53/tcp"
      - "8053:8053"
    depends_on:
      - control-api
      - edge-sg
      - edge-jp
      - edge-th
    restart: unless-stopped
    networks:
      cdn-net:
        ipv4_address: 172.28.0.53

  purge-api:
    build:
      context: ./purge-api
    container_name: cdn-purge-api
    ports:
      - "8090:8090"
    environment:
      PURGE_TOKEN: ${CDN_PURGE_TOKEN:***REDACTED***}
    depends_on:
      - control-api
      - edge-sg
      - edge-jp
      - edge-th
    volumes:
      - edge_sg_cache:/cache/sg
      - edge_jp_cache:/cache/jp
      - edge_th_cache:/cache/th
    restart: unless-stopped
    networks:
      - cdn-net

volumes:
  cdn_control_data:
  edge_sg_rules:
  edge_jp_rules:
  edge_th_rules:
  edge_sg_cache:
  edge_jp_cache:
  edge_th_cache:

networks:
  cdn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  waf-net:
    external: true
    name: ${WAF_NETWORK_NAME:-waf_project_waf-net}
