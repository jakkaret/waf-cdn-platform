<!DOCTYPE html>
<html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content=width=device-width, initial-scale=1.0>
    <title>403 Forbidden - WAF Protection</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 10px;
        }
        h1 {
            color: #ef4444;
            margin: 0 0 10px 0;
            font-size: 28px;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .badge {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .footer {
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class=card>
        <div class=icon>🛡️</div>
        <div class=badge>WAF SECURITY BLOCK</div>
        <h1>403 Forbidden</h1>
        <p>Your request was blocked by the Web Application Firewall (WAF) because it contained suspicious or malicious patterns.</p>
        <div class=footer>
            Protected by OWASP ModSecurity WAF & CDN Edge
        </div>
    </div>
</body>
</html>
