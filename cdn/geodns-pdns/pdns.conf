# PowerDNS Authoritative on each edge: GeoDNS + health checks for
# cdn.waf-it-kku.online (see README.md). Authoritative only -- it never
# recurses, so it answers nothing outside its own zone.
launch=bind,geoip
bind-config=/etc/powerdns/named.conf
geoip-database-files=mmdb:/etc/powerdns/geo/dbip-country-lite.mmdb
geoip-zones-file=/etc/powerdns/geoip-zones.yml
enable-lua-records=yes
# Use the visitor's subnet (EDNS Client Subnet) when the resolver sends it,
# not only the resolver's own address.
edns-subnet-processing=yes
# local-address / local-port come from the command line (per edge).
disable-axfr=yes
version-string=anonymous
# Answers are computed per query; keep the packet cache short so a failed
# health check takes effect quickly.
cache-ttl=10
negquery-cache-ttl=60
# Bind port 53 as root, then run as pdns.
setuid=pdns
setgid=pdns
