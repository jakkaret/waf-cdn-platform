name: CI — WAF Dashboard

on:
  push:
    branches: [main, develop, backend]
  pull_request:
    branches: [main, develop, backend]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Python Backend Lint ──────────────────────────────────────────
  lint-backend:
    name: "Lint: Backend (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --output-format=github

  # ── Job 2: Frontend Type Check + Lint ──────────────────────────────────
  lint-frontend:
    name: "Lint: Frontend (TypeScript)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Job 3: Frontend Build ───────────────────────────────────────────────
  build-frontend:
    name: "Build: Frontend (Vite)"
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: dashboard/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dashboard/frontend/dist/
          retention-days: 7

  # ── Job 4: Backend Unit Tests ───────────────────────────────────────────
  test-backend:
    name: "Test: Backend (pytest)"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: dashboard/backend

    # Mock DynamoDB via LocalStack
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb
          DEFAULT_REGION: ap-southeast-1

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-southeast-1
      DYNAMODB_ENDPOINT_URL: http://localhost:4566
      JWT_SECRET_KEY: ***REDACTED***
      ORIGINS_QUOTA_DEFAULT: "5"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx pytest-asyncio

      - name: Wait for LocalStack DynamoDB
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:4566/health | grep -q '"dynamodb": "available"' && break
            echo "Waiting for LocalStack..." && sleep 3
          done

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ── Job 5: E2E Tests (Playwright) ──────────────────────────────────────
  test-e2e:
    name: "Test: E2E (Playwright)"
    runs-on: ubuntu-latest
    needs: [build-frontend]
    defaults:
      run:
        working-directory: dashboard/frontend

    env:
      # Tell Playwright config to not auto-start dev server in CI (we use preview)
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dashboard/frontend/dist/

      - name: Serve built frontend (background)
        run: npx vite preview --port 5173 &
        # Give preview server a moment to start
      
      - name: Wait for frontend server
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:5173 && break
            echo "Waiting for preview server..." && sleep 2
          done

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        # Note: E2E tests that require backend API will skip gracefully

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/frontend/playwright-report/
          retention-days: 30
