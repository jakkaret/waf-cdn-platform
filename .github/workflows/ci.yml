name: CI — WAF Dashboard

on:
  push:
    # The real branch is "Backend" (capital B); the old list only had
    # "backend", so this workflow never ran on a push (found 2026-09-29).
    branches: [main, develop, backend, Backend]
  pull_request:
    branches: [main, develop, backend, Backend]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Python Backend Lint ──────────────────────────────────────────
  lint-backend:
    name: "Lint: Backend (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      # Blocking: rule classes that are real bugs (syntax errors, undefined
      # names, redefinitions, statements with no effect). The full default
      # rule set has ~1,400 style findings; it runs below as a report only
      # until that backlog is cleaned up.
      - name: Run ruff (bug classes, blocking)
        run: ruff check . --select E9,F63,F7,F82,F811,B018 --output-format=github

      - name: Run ruff (full, report only)
        continue-on-error: true
        run: ruff check . --output-format=github --exit-zero --statistics

  # ── Job 2: Frontend Type Check + Lint ──────────────────────────────────
  lint-frontend:
    name: "Lint: Frontend (TypeScript)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Job 3: Frontend Build ───────────────────────────────────────────────
  build-frontend:
    name: "Build: Frontend (Vite)"
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: dashboard/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dashboard/frontend/dist/
          retention-days: 7

  # ── Job 4: Backend Unit Tests ───────────────────────────────────────────
  # tests/conftest.py fakes DynamoDB/ClickHouse/Redis/docker at their service
  # boundary, so no LocalStack is needed. Not gated on lint: a style finding
  # must not hide a failing test.
  test-backend:
    name: "Test: Backend (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx pytest-asyncio pytest-cov fakeredis

      - name: Run pytest with coverage
        run: pytest tests/ -q --tb=short --cov=. --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: dashboard/backend/coverage.xml
          retention-days: 14

  # ── Job 4b: control-api Tests (CAPTCHA / OTP shield) ───────────────────
  test-control-api:
    name: "Test: control-api (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdn/control-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest tests -q --tb=short

  # ── Job 4c: Security scans ──────────────────────────────────────────────
  # Blocking: bandit HIGH findings. Report only for now (known backlog,
  # tracked in docs/KNOWN_ISSUES.md): dependency CVEs (starlette via the
  # fastapi pin), semgrep ERROR findings, and secrets in git history.
  security:
    name: "Security: bandit / pip-audit / semgrep / gitleaks"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install bandit pip-audit semgrep

      - name: bandit (HIGH severity, blocking)
        run: bandit -q -r dashboard/backend cdn/control-api -x '*/tests/*' -lll

      - name: pip-audit (report only)
        continue-on-error: true
        run: |
          pip-audit -r dashboard/backend/requirements.txt
          pip-audit -r cdn/control-api/requirements.txt

      - name: semgrep (report only)
        continue-on-error: true
        run: semgrep --config p/python --config p/security-audit --severity ERROR --metrics off --error dashboard/backend cdn/control-api --exclude tests

      - name: gitleaks (report only)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 5: ML Unit Tests (pytest) ───────────────────────────────────────
  test-ml:
    name: "Test: ML (pytest)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # Deliberately minimal (R1): scikit-learn, pandas, numpy, pytest only.
        # No requirements.txt -- keep this separate from the backend pytest
        # job, which does not install scikit-learn. Model artifacts are
        # already committed under ml/models/, so nothing else is needed.
        run: pip install scikit-learn pandas numpy pytest

      - name: Run pytest
        run: python -m pytest ml/tests/ -v

  # ── Job 6: E2E Tests (Playwright) ──────────────────────────────────────
  test-e2e:
    name: "Test: E2E (Playwright)"
    runs-on: ubuntu-latest
    needs: [build-frontend]
    defaults:
      run:
        working-directory: dashboard/frontend

    env:
      # Tell Playwright config to not auto-start dev server in CI (we use preview)
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dashboard/frontend/dist/

      - name: Serve built frontend (background)
        run: npx vite preview --port 5173 &
        # Give preview server a moment to start
      
      - name: Wait for frontend server
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:5173 && break
            echo "Waiting for preview server..." && sleep 2
          done

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        # Note: E2E tests that require backend API will skip gracefully

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/frontend/playwright-report/
          retention-days: 30
