name: CI — WAF Dashboard

on:
  push:
    # The real branch is "Backend" (capital B); the old list only had
    # "backend", so this workflow never ran on a push (found 2026-09-29).
    branches: [main, develop, backend, Backend]
  pull_request:
    branches: [main, develop, backend, Backend]

# Least privilege (audit H01): every job only reads the repository. A job
# that needs more must ask for it in its own permissions block.
permissions:
  contents: read

env:
  # control-api and the other CDN containers run python:3.11-slim.
  PYTHON_VERSION: "3.11"
  # Backend and ML run from a host venv (Python 3.14 on Main); their pins
  # (numpy 2.5.3, pandas 3.0.6) need Python >= 3.12, so 3.11 could not install them.
  BACKEND_PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Python Backend Lint ──────────────────────────────────────────
  lint-backend:
    name: "Lint: Backend (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.17.1

      # Blocking: rule classes that are real bugs (syntax errors, undefined
      # names, redefinitions, statements with no effect). The full default
      # rule set has ~1,400 style findings; it runs below as a report only
      # until that backlog is cleaned up.
      - name: Run ruff (bug classes, blocking)
        run: ruff check . --select E9,F63,F7,F82,F811,B018 --output-format=github

      - name: Run ruff (full, report only)
        continue-on-error: true
        run: ruff check . --output-format=github --exit-zero --statistics

  # ── Job 2: Frontend Type Check + Lint ──────────────────────────────────
  lint-frontend:
    name: "Lint: Frontend (TypeScript)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Job 3: Frontend Build ───────────────────────────────────────────────
  build-frontend:
    name: "Build: Frontend (Vite)"
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: dashboard/frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: dashboard/frontend/dist/
          retention-days: 7

  # ── Job 4: Backend Unit Tests ───────────────────────────────────────────
  # The control-plane store is a real PostgreSQL service: tests/pg_harness.py
  # builds a throwaway database from db/migrations and conftest empties it
  # before every test. ClickHouse/Redis/docker are faked at their service
  # boundary. Not gated on lint: a style finding must not hide a failing test.
  test-backend:
    name: "Test: Backend (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/backend
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0 pytest-cov==7.1.0 fakeredis==2.40.0

      - name: Run pytest with coverage
        run: pytest tests/ -q --tb=short --cov=. --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: dashboard/backend/coverage.xml
          retention-days: 14

  # ── Job 4b: control-api Tests (CAPTCHA / OTP shield) ───────────────────
  test-control-api:
    name: "Test: control-api (pytest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdn/control-api

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1

      - name: Run pytest
        run: python -m pytest tests -q --tb=short

  # ── Job 4c: Security scans ──────────────────────────────────────────────
  # Blocking: bandit HIGH findings. Report only for now (known backlog,
  # tracked in docs/KNOWN_ISSUES.md): dependency CVEs (starlette via the
  # fastapi pin), semgrep ERROR findings, and secrets in git history.
  security:
    name: "Security: bandit / pip-audit / semgrep / gitleaks"
    runs-on: ubuntu-latest
    # gitleaks-action lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install bandit==1.9.4 pip-audit==2.10.1 semgrep==1.181.0

      - name: bandit (HIGH severity, blocking)
        run: bandit -q -r dashboard/backend cdn/control-api -x '*/tests/*' -lll

      - name: pip-audit (report only)
        continue-on-error: true
        run: |
          pip-audit -r dashboard/backend/requirements.txt
          pip-audit -r cdn/control-api/requirements.txt

      - name: semgrep (report only)
        continue-on-error: true
        run: semgrep --config p/python --config p/security-audit --severity ERROR --metrics off --error dashboard/backend cdn/control-api --exclude tests

      - name: gitleaks (report only)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting on a PR needs write access; this job only reads.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ── Job 5: ML Unit Tests (pytest) ───────────────────────────────────────
  test-ml:
    name: "Test: ML (pytest)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.BACKEND_PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # ml/tests import ml.ml_api, which pulls in fastapi, joblib and the
        # backend's other runtime packages; the old minimal set
        # (scikit-learn, pandas, numpy) failed at collection on the first CI
        # run that actually executed (2026-09-29). Model artifacts are
        # committed under ml/models/.
        run: pip install -r dashboard/backend/requirements.txt pytest==9.1.1

      - name: Run pytest
        run: python -m pytest ml/tests/ -v

  # ── Job 6: E2E Tests (Playwright) ──────────────────────────────────────
  test-e2e:
    name: "Test: E2E (Playwright)"
    runs-on: ubuntu-latest
    needs: [build-frontend]
    defaults:
      run:
        working-directory: dashboard/frontend

    env:
      # Tell Playwright config to not auto-start dev server in CI (we use preview)
      CI: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download frontend build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: dashboard/frontend/dist/

      - name: Run Playwright tests
        # playwright.config.ts serves dist/ with vite preview itself; only
        # tests/smoke.spec.ts runs here (e2e.spec.ts needs E2E_BASE_URL).
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: dashboard/frontend/playwright-report/
          retention-days: 30
