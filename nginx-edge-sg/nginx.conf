worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── ตัวแปร Region ── #
    map $host $cdn_region {
        default "SG";
    }

    # ──────────────────────────────────────────────────────
    # CACHE ZONE DEFINITION
    # levels=1:2       → โครงสร้างโฟลเดอร์ cache (ป้องกัน inode ล้น)
    # keys_zone=CDN_SG → ชื่อ shared memory zone (10MB ≈ 80,000 keys)
    # max_size=5g      → ขนาด disk cache สูงสุด
    # inactive=60m     → ลบ cache ที่ไม่ถูกเข้าถึงใน 60 นาที
    # use_temp_path=off → เขียน cache ตรงไม่ผ่าน /tmp (เร็วกว่า)
    # ──────────────────────────────────────────────────────
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=CDN_SG:10m
        max_size=5g
        inactive=60m
        use_temp_path=off;

    # ── Log Format (JSON) สำหรับ cache hit/miss analytics ── #
    log_format cdn_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"region":"SG",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":"$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"request_time":"$request_time",'
            '"cache_status":"$upstream_cache_status",'
            '"http_user_agent":"$http_user_agent",'
            '"http_referer":"$http_referer"'
        '}';

    access_log /var/log/nginx/access.json cdn_json;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Gzip Compression ── #
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ── Load cache policy ── #
    include /etc/nginx/conf.d/cache-policy.conf;

    # ──────────────────────────────────────────────────────
    # UPSTREAM – Origin Server (DVWA)
    # แยก origin ออกมาชัดเจน (Origin Separation)
    # ──────────────────────────────────────────────────────
    upstream dvwa_origin {
        server origin.internal:80;  # ← DVWA container
        keepalive 32;               # connection pool
    }

    server {
        listen 80;
        server_name _;

        # ── Security Headers ── #
        add_header X-CDN-Region    "SG"                always;
        add_header X-Cache-Status  $upstream_cache_status always;
        add_header X-Frame-Options "SAMEORIGIN"        always;
        add_header X-Content-Type-Options "nosniff"    always;

        # ── Health Check (ไม่ log) ── #
        location = /healthz {
            access_log off;
            return 200 '{"status":"ok","region":"SG"}';
            add_header Content-Type application/json;
        }

        # ── Cache Stats endpoint ── #
        location = /cdn-status {
            access_log off;
            stub_status;
        }

        # ──────────────────────────────────────────
        # STATIC ASSETS – Cache นาน (1 ปี)
        # รูปแบบ: .jpg .png .css .js .woff2 ฯลฯ
        # ──────────────────────────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|eot)$ {
            proxy_pass http://dvwa_origin;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-CDN-Region      "SG";

            # Cache config
            proxy_cache              CDN_SG;
            proxy_cache_key          "$scheme$host$request_uri";
            proxy_cache_valid        200 302    1y;   # สำเร็จ → cache 1 ปี
            proxy_cache_valid        404        10m;  # not found → 10 นาที
            proxy_cache_use_stale    error timeout updating
                                     http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock         on;
            proxy_cache_lock_timeout 5s;

            # Browser cache
            expires 1y;
            add_header Cache-Control  "public, immutable";
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-CDN-Region   "SG"                   always;
        }

        # ──────────────────────────────────────────
        # API ENDPOINTS – ไม่ cache (Dynamic)
        # ──────────────────────────────────────────
        location ~* ^/(api|setup\.php|login\.php|logout\.php) {
            proxy_pass http://dvwa_origin;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-CDN-Region      "SG";

            # ห้าม cache เด็ดขาด
            proxy_cache_bypass 1;
            proxy_no_cache     1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma        "no-cache";
            add_header X-Cache-Status "BYPASS" always;
            add_header X-CDN-Region   "SG"     always;
        }

        # ──────────────────────────────────────────
        # HTML PAGES – Cache สั้น (5 นาที)
        # ──────────────────────────────────────────
        location / {
            proxy_pass http://dvwa_origin;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-CDN-Region      "SG";
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache HTML 5 นาที
            proxy_cache           CDN_SG;
            proxy_cache_key       "$scheme$host$request_uri$is_args$args";
            proxy_cache_valid     200  5m;
            proxy_cache_valid     301 302 1h;
            proxy_cache_valid     404 1m;
            proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
            proxy_cache_bypass    $cookie_session $http_authorization $arg_nocache;
            proxy_no_cache        $cookie_session $http_authorization $arg_nocache;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-CDN-Region   "SG"                   always;

            # Timeout
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Error page
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
