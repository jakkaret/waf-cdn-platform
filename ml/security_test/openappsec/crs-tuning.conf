# CRS 4.25.1 tuning for the open-appsec benchmark: loaded after CRS
# (RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf), systems "<BASE>-tuned" in run_benchmark.sh.
#
# Chosen on the gen half's legitimate traffic only (crs_fp_attribution.py, split.py), measured on
# the eval half. On the gen half these two rules matched cookie values in 99% (932270) and 91%
# (942550) of the blocked legitimate requests they appeared in; no malicious request of the
# dataset carries its payload in a cookie, and both rules keep inspecting ARGS, ARGS_NAMES,
# REQUEST_COOKIES_NAMES and XML.
#
# 932270  RCE: Unix shell tilde expansion  ~[+-](?:$|[0-9]+)   (tracking cookies hold "~-1" etc.)
# 942550  SQLi: JSON-based SQL injection                         (cookies holding JSON values)
SecRuleUpdateTargetById 932270 "!REQUEST_COOKIES"
SecRuleUpdateTargetById 942550 "!REQUEST_COOKIES"
