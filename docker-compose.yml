services:
  waf:
    image: owasp/modsecurity-crs@sha256:4d5e1c4605df9a89ca85db742d8e7e39cbbf5b656264091ed9ab1211d2476e6a  # CRS 4.25.1-nginx-lts (multiarch digest) -- rollback: re-pin 095ec5...=3.3.10
    container_name: waf-nginx
    user: root
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/templates/conf.d/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/templates/modsecurity.d/setup.conf.template:/etc/nginx/templates/modsecurity.d/setup.conf.template:ro
      - ./nginx/templates/modsecurity.d/modsecurity.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity.conf.template:ro
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./modsecurity/custom-rules:/opt/custom-rules:ro
      - ./logs/modsecurity:/var/log/modsecurity
      - ./logs/nginx:/var/log/nginx
      - ./nginx/templates/includes/captcha_server.conf.template:/etc/nginx/templates/includes/captcha_server.conf.template:ro
      - ./nginx/includes/otp_server.conf:/etc/nginx/includes/otp_server.conf:ro
      - ./html/403.html:/usr/share/nginx/html/403.html:ro
      - ./nginx/templates/conf/server.key:/etc/nginx/conf/server.key
      - ./nginx/templates/conf/server.crt:/etc/nginx/conf/server.crt
    # Only the two secrets the templates use (H80). This container takes
    # traffic straight from the internet, so it must not get the whole .env.
    environment:
      PARANOIA: 1
      ANOMALY_INBOUND: 10
      ANOMALY_OUTBOUND: 10
      TZ: Asia/Bangkok
      ML_RELAY_SECRET: "${ML_RELAY_SECRET:?set ML_RELAY_SECRET in .env}"
      DECEPTION_INTERNAL_KEY: "${DECEPTION_INTERNAL_KEY:?set DECEPTION_INTERNAL_KEY in .env}"
    depends_on:
      - dvwa
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # Image's baked-in healthcheck probes https://localhost:${SSL_PORT}/healthz,
      # but this template does not open an SSL listener (TLS terminates upstream
      # at Caddy) -- it always fails with connection refused. Probe the real
      # listener instead.
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - waf-net

  dvwa:
    image: sagikazarmark/dvwa
    container_name: dvwa
    entrypoint: [ "/bin/sh", "-c", "rm -f /var/run/apache2/apache2.pid && exec /run.sh" ]
    environment:
      - MYSQL_HOSTNAME=dvwa-db
      - MYSQL_DATABASE=dvwa
      - MYSQL_USERNAME=dvwa
      - MYSQL_PASSWORD=dvwa
    restart: unless-stopped
    networks:
      - waf-net

  caddy:
    image: caddy:alpine
    container_name: caddy-ssl-termination
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - waf
    networks:
      - waf-net

  redis:
    image: redis:alpine
    container_name: waf-redis
    # Loopback only (the dashboard runs on the host); containers use redis:6379
    # on waf-net. The password is read from the environment at start, so it is
    # not written into the compose file or the container's Cmd.
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    # appendonly + a named volume (P2.2/H83): the shield's CAPTCHA/OTP
    # settings live only here, and a recreated container without a volume lost
    # them all (2026-10-15). services/shield_sync.py also rebuilds the
    # per-domain keys, the host map and the rate-limit rules every minute.
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - waf-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: waf-clickhouse
    # Loopback only: the dashboard and log analyzer run on the host.
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    restart: unless-stopped
    networks:
      - waf-net

  control-api:
    build: ./cdn/control-api
    container_name: waf-control-api
    # Loopback for host tools, and Main's WireGuard address for the edges
    # (deploy/wireguard). docker.service starts after wg-quick@wg0
    # (deploy/wireguard/docker-after-wg.conf) so this address exists.
    ports:
      - "127.0.0.1:8070:8070"
      - "10.88.0.1:8070:8070"
    volumes:
      - ./modsecurity/custom-rules:/src/custom-rules:ro
      - control_data:/data
    depends_on:
      - redis
    environment:
      CONTROL_TOKEN: "${CONTROL_TOKEN:?set CONTROL_TOKEN in .env}"
      # shared secret of the dashboard ML relay (F-019), same value nginx gets
      ML_RELAY_SECRET: "${ML_RELAY_SECRET:?set ML_RELAY_SECRET in .env}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0"
      # N6: the CAPTCHA and OTP clearance cookies are signed with keys of their
      # own (no fallback to CONTROL_TOKEN); the service refuses to start without
      # them. Rotating one signs every visitor out of that gate.
      CAPTCHA_HMAC_SECRET: "${CAPTCHA_HMAC_SECRET:?set CAPTCHA_HMAC_SECRET in .env}"
      OTP_HMAC_SECRET: "${OTP_HMAC_SECRET:?set OTP_HMAC_SECRET in .env}"
      # P2.5: only the WAF's nginx may tell control-api the visitor's address.
      SHIELD_TRUSTED_PROXIES: "waf-nginx"
      # P4.1: signs the rule bundle; the edges hold the same value.
      BUNDLE_SIGNING_KEY: "${BUNDLE_SIGNING_KEY:?set BUNDLE_SIGNING_KEY in .env}"
      # OTP Shield email delivery -- unset by default (see
      # cdn/control-api/email_sender.py: send_otp_email() fails loud and
      # logs, rather than pretending an email went out, until real SMTP
      # credentials are supplied here).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      # Integration tests: OTP mail to these recipient domains goes to the
      # qa-mailpit capture container (scripts/qa/infra.sh) instead of the
      # real relay. Empty QA_MAIL_DOMAINS turns this off.
      QA_MAIL_DOMAINS: "${QA_MAIL_DOMAINS:-qa.waf-it-kku.online}"
      QA_SMTP_HOST: "${QA_SMTP_HOST:-mailpit}"
      QA_SMTP_PORT: "${QA_SMTP_PORT:-1025}"
    restart: unless-stopped
    extra_hosts:
      # Gen3 1.3: ml_policy.py relays to dashboard-backend's existing
      # shadow-decision endpoint (runs on the host via systemd, not in this
      # compose network) at host.docker.internal:8000 -- same target nginx's
      # own (currently unwired) ML mirror hook uses.
      - "host.docker.internal:host-gateway"
    networks:
      - waf-net

  # Control-plane database (users, origins, domains, alerts, audit, rules).
  # The dashboard backend runs on the host (systemd), so the port is bound to
  # 127.0.0.1 only. The superuser password is a compose secret read from a
  # file outside git; deploy/postgres/bootstrap.sh creates it, applies
  # dashboard/backend/db/migrations and the app/maintenance login roles, and
  # writes DATABASE_URL / DATABASE_URL_MAINT to .env.
  #   bash deploy/postgres/bootstrap.sh     (once per machine, idempotent)
  postgres:
    image: postgres:16.15-alpine
    container_name: ${WAF_PG_CONTAINER:-waf-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: waf_owner
      POSTGRES_DB: waf
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    secrets:
      - pg_owner_password
    # Small host (~3.7 GB RAM shared with ClickHouse): default shared_buffers
    # and few connections (app pool 12 + retention worker + psql/migrate).
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - log_min_duration_statement=1000
    ports:
      - "127.0.0.1:${WAF_PG_PORT:-5432}:5432"
    volumes:
      - waf_pgdata:/var/lib/postgresql/data
      - ${WAF_BACKUP_DIR:-./backups/pg}:/backups
    shm_size: 128m
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waf_owner -d waf"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Its own network, NOT waf-net: nothing in this compose needs the
    # database (the backend reaches it on 127.0.0.1), and waf-net carries the
    # deliberately vulnerable dvwa test app and the WAF/edge containers.
    networks:
      - pg-net

volumes:
  redis_data:
  caddy_data:
  caddy_config:
  clickhouse_data:
  control_data:
  waf_pgdata:
    name: ${WAF_PG_VOLUME:-waf_pgdata}

secrets:
  pg_owner_password:
    file: ${WAF_SECRETS_DIR:-./secrets}/pg_owner_password

networks:
  waf-net:
    driver: bridge
  pg-net:
    driver: bridge
