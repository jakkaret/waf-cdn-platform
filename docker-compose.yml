services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf-nginx
    user: root
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/templates/conf.d/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/templates/modsecurity.d/setup.conf.template:/etc/nginx/templates/modsecurity.d/setup.conf.template:ro
      - ./nginx/templates/modsecurity.d/modsecurity.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity.conf.template:ro
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./modsecurity/custom-rules:/opt/custom-rules:ro
      - ./logs/modsecurity:/var/log/modsecurity
      - ./logs/nginx:/var/log/nginx
      - ./html/403.html:/usr/share/nginx/html/403.html:ro
      - ./nginx/templates/conf/server.key:/etc/nginx/conf/server.key
      - ./nginx/templates/conf/server.crt:/etc/nginx/conf/server.crt
    environment:
      PARANOIA: 1
      ANOMALY_INBOUND: 10
      ANOMALY_OUTBOUND: 10
      TZ: Asia/Bangkok
    depends_on:
      - dvwa
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - waf-net

  dvwa:
    image: sagikazarmark/dvwa
    container_name: dvwa
    entrypoint: [ "/bin/sh", "-c", "rm -f /var/run/apache2/apache2.pid && exec /run.sh" ]
    environment:
      - MYSQL_HOSTNAME=dvwa-db
      - MYSQL_DATABASE=dvwa
      - MYSQL_USERNAME=dvwa
      - MYSQL_PASSWORD=dvwa
    restart: unless-stopped
    networks:
      - waf-net

  caddy:
    image: caddy:alpine
    container_name: caddy-ssl-termination
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - waf
    networks:
      - waf-net

  redis:
    image: redis:alpine
    container_name: waf-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - waf-net

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: waf-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=***REDACTED***
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    restart: unless-stopped
    networks:
      - waf-net

  control-api:
    build: ./cdn/control-api
    container_name: waf-control-api
    ports:
      - "8070:8070"
    volumes:
      - ./modsecurity/custom-rules:/src/custom-rules:ro
      - control_data:/data
    environment:
      CONTROL_TOKEN: "***REDACTED***"
    restart: unless-stopped
    networks:
      - waf-net

volumes:
  caddy_data:
  caddy_config:
  clickhouse_data:
  control_data:

networks:
  waf-net:
    driver: bridge
