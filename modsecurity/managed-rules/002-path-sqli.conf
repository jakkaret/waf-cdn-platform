# SQL injection in a URL path segment (Known Issue #17). At PL1, CRS scores
# /products/1' OR 1=1-- at 5, under the inbound threshold of 10, so it passes.
# This blocks a quote that is immediately followed by an SQL operator, keyword
# or comment opener. Apostrophes inside ordinary words (don't, o'reilly,
# rock'n'roll) do not match. Query-string and body SQLi stay with CRS.
SecRule REQUEST_FILENAME "@rx ['\"`]\s*\)?\s*(?:(?:or|and|xor|union|select|having)\b|order\s+by\b|group\s+by\b|;|--|#|/\*)" \
    "id:3000006,phase:1,deny,status:403,log,t:none,t:urlDecodeUni,t:lowercase,severity:CRITICAL,msg:'Managed: SQL injection in URL path segment',tag:'managed-ruleset',tag:'attack-sqli'"
