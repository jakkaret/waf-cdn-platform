# Managed ruleset — critical, widely exploited CVEs not covered by CRS 3.3.10.

# Log4Shell (CVE-2021-44228/45046): JNDI and lookup-obfuscation prefixes in any
# part of the request. Decoded, lowercased and with whitespace removed first so
# "${ jNdI :" and "%24%7Bjndi:" are caught too.
SecRule REQUEST_URI|ARGS|ARGS_NAMES|REQUEST_HEADERS|REQUEST_BODY "@rx \$\{(?:jndi:|lower:|upper:|env:|sys:|::-|date:|main:)" \
    "id:3000001,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,t:lowercase,t:removeWhitespace,severity:CRITICAL,msg:'Managed: Log4Shell JNDI/lookup injection (CVE-2021-44228)',tag:'managed-ruleset',tag:'CVE-2021-44228'"

# Spring4Shell (CVE-2022-22965): class.module.classLoader data binding.
SecRule ARGS_NAMES|REQUEST_BODY "@rx class\.module\.classloader" \
    "id:3000002,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,t:lowercase,severity:CRITICAL,msg:'Managed: Spring4Shell classLoader binding (CVE-2022-22965)',tag:'managed-ruleset',tag:'CVE-2022-22965'"

# Apache HTTP Server path traversal (CVE-2021-41773/42013): encoded dot segments
# in the raw request line.
SecRule REQUEST_URI_RAW "@rx (?i)(?:\.%2e|%2e\.|%2e%2e|\.%%32%65|%%32%65\.)(?:/|%2f)" \
    "id:3000003,phase:1,deny,status:403,log,t:none,severity:CRITICAL,msg:'Managed: Apache encoded path traversal (CVE-2021-41773)',tag:'managed-ruleset',tag:'CVE-2021-41773'"

# Shellshock (CVE-2014-6271): function definition in a header value.
SecRule REQUEST_HEADERS "@rx ^\s*\(\s*\)\s*\{" \
    "id:3000004,phase:1,deny,status:403,log,t:none,severity:CRITICAL,msg:'Managed: Shellshock function definition (CVE-2014-6271)',tag:'managed-ruleset',tag:'CVE-2014-6271'"

# Atlassian Confluence OGNL injection (CVE-2022-26134): OGNL expression reaching
# java.lang.Runtime in the URI.
SecRule REQUEST_URI "@rx \$\{[^}]{0,200}(?:java\.lang\.runtime|getruntime\(\)|@java\.lang)" \
    "id:3000005,phase:1,deny,status:403,log,t:none,t:urlDecodeUni,t:lowercase,severity:CRITICAL,msg:'Managed: Confluence OGNL injection (CVE-2022-26134)',tag:'managed-ruleset',tag:'CVE-2022-26134'"
