# Detection-only rules for the 5 WAF signature gaps found by live payload
# testing (Trello card "ปิดช่องว่าง WAF signature 5 จุด", report page 20).
#
# These use `pass,log`: they RECORD a match in the audit log but do NOT block
# and do NOT add to the CRS anomaly score, so deploying them changes no
# traffic outcome. They exist to (a) prove the WAF now sees these patterns and
# (b) let us replay real logs to measure false positives before any of them is
# promoted to `deny,status:403`.
#
# PROMOTION: after a false-positive review (Blast Radius / log replay), change
# `pass` to `deny,status:403` on the rules that are FP-clean. WEB-01 (bare
# quote) and the command-separator rule are the highest FP risk -- do not
# promote them without evidence; apostrophes and semicolons occur in benign
# traffic.

# WEB-01 -- bare single quote. Probe indicator only (PARANOIA level 1 misses
# it). Very high false-positive rate; expected to stay detection-only.
SecRule ARGS "@rx '" \
 "id:910001,phase:2,pass,log,t:none,severity:NOTICE,\
  tag:'waf-gap-detection',tag:'probe',\
  msg:'DETECT-ONLY WEB-01: single quote in argument (SQLi probe indicator)'"

# WEB-02/03 -- OS command injection via separators the current rules miss:
# `;`, backtick, and pipe/AND chains followed by a word (a likely command).
SecRule ARGS|REQUEST_BODY "@rx (?:;|\x60|\|\||&&)\s*[a-zA-Z]" \
 "id:910002,phase:2,pass,log,t:none,severity:WARNING,\
  tag:'waf-gap-detection',tag:'command-injection',\
  msg:'DETECT-ONLY WEB-02/03: command separator (; backtick || &&) before token'"

# WEB-04 -- SSTI. Existing rules catch ${...} but not the {{...}} used by
# Jinja2/Twig.
SecRule ARGS|REQUEST_BODY "@rx \{\{.{0,200}?\}\}" \
 "id:910004,phase:2,pass,log,t:none,severity:WARNING,\
  tag:'waf-gap-detection',tag:'ssti',\
  msg:'DETECT-ONLY WEB-04: template expression {{...}} (SSTI probe)'"

# WEB-05 -- NoSQL operator injection. Existing rules catch $gt but not $ne and
# the rest of the operator family, including inside JSON bodies.
SecRule ARGS|REQUEST_BODY "@rx \$(?:ne|eq|gt|gte|lt|lte|in|nin|regex|where|exists|or|and)\b" \
 "id:910005,phase:2,pass,log,t:none,severity:WARNING,\
  tag:'waf-gap-detection',tag:'nosql-injection',\
  msg:'DETECT-ONLY WEB-05: NoSQL operator ($ne/$gt/...) in argument or body'"
