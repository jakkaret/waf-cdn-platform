# PostgreSQL for the WAF control-plane (replaces DynamoDB + SQLite).
#
# Its own compose project on purpose: running `docker compose up` here can
# never recreate waf-nginx / caddy / clickhouse from the main
# docker-compose.yml (which carries server-local changes on Main).
#
#   docker compose -f deploy/postgres/compose.yml -p waf-postgres up -d
#
# Bound to 127.0.0.1 only: the dashboard backend runs on the host (systemd
# waf-dashboard), nothing outside Main may reach the database.
# The superuser password comes from a root-only file outside the repo
# (created by deploy/postgres/bootstrap.sh), never from this file or .env.
name: waf-postgres

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: waf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: waf_owner
      POSTGRES_DB: waf
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    # Main has ~3.7 GB RAM shared with ClickHouse: keep shared_buffers at the
    # default (128MB) and cap connections (app pool 12 + worker + psql/migrate).
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - log_min_duration_statement=1000
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - waf_pgdata:/var/lib/postgresql/data
      - /root/.waf-secrets/pg_owner_password:/run/secrets/pg_owner_password:ro
      - /root/backups/pg:/backups
    shm_size: 128m
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waf_owner -d waf"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  waf_pgdata:
    name: waf_pgdata
