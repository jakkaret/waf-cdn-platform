<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signing in...</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: #0d1117;
            color: #e4e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            gap: 12px;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { font-size: 14px; opacity: 0.5; margin: 0; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Completing sign in...</p>

    <script src="/assets/auth.js"></script>
    <script>
        (async () => {
            const params = new URLSearchParams(window.location.search);
            const token  = params.get("token");

            if (!token) {
                window.location.href = "/login.html?error=no_token";
                return;
            }

            try {
                // ดึงข้อมูล user ด้วย token ที่ได้มา
                const res = await fetch("/api/auth/me", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!res.ok) {
                    window.location.href = "/login.html?error=invalid_token";
                    return;
                }

                const user = await res.json();
                Auth.saveSession(token, user);
                window.location.href = "/";

            } catch (e) {
                window.location.href = "/login.html?error=network";
            }
        })();
    </script>
</body>
</html>
