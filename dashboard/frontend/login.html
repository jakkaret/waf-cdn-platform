<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WAF Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        :root {
            --bg:          #0d1117;
            --surface:     #161b27;
            --surface-2:   #1e2438;
            --border:      rgba(255,255,255,0.07);
            --accent:      #667eea;
            --accent-2:    #764ba2;
            --accent-tg:   #229ed9;
            --text:        #e4e8f0;
            --text-muted:  rgba(255,255,255,0.4);
            --danger:      #fc8181;
            --success:     #68d391;
            --radius:      10px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        .card-glow {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(102,126,234,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            color: var(--accent);
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
        }

        .brand-tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            display: block;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* OAuth buttons */
        .oauth-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .oauth-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, background 0.2s;
            font-family: 'DM Sans', sans-serif;
        }

        .oauth-btn:hover {
            border-color: rgba(255,255,255,0.18);
            background: #252b47;
        }

        .oauth-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .oauth-btn.telegram {
            color: var(--accent-tg);
            border-color: rgba(34,158,217,0.25);
        }

        .oauth-btn.telegram:hover {
            border-color: rgba(34,158,217,0.5);
            background: rgba(34,158,217,0.07);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Form */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            margin-bottom: 7px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: rgba(102,126,234,0.5);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            font-family: 'DM Sans', sans-serif;
            transition: opacity 0.2s, transform 0.1s;
            letter-spacing: 0.2px;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: rgba(252,129,129,0.1);
            border: 1px solid rgba(252,129,129,0.3);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 13px;
            color: var(--danger);
            margin-bottom: 16px;
            display: none;
        }

        .error-msg.visible { display: block; }

        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .footer-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover { text-decoration: underline; }

        /* Telegram widget wrapper */
        #tg-widget-wrap {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        #tg-widget-wrap.open {
            display: flex;
        }

        .tg-modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            max-width: 340px;
            width: 90%;
        }

        .tg-modal h3 {
            margin-bottom: 8px;
            font-size: 16px;
        }

        .tg-modal p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .tg-close {
            margin-top: 16px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            padding: 8px 20px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="card-glow"></div>

    <div class="brand">
        <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <div>
            <span class="brand-name">WAF Dashboard</span>
            <span class="brand-tag">Security Control Panel</span>
        </div>
    </div>

    <h1>Sign in</h1>
    <p class="subtitle">Access the security control panel</p>

    <div class="oauth-group">
        <a href="/api/auth/google" class="oauth-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </a>

        <button class="oauth-btn telegram" onclick="openTelegramModal()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z"/>
            </svg>
            Continue with Telegram
        </button>
    </div>

    <div class="divider">or sign in with email</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form" novalidate>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Sign in</button>
    </form>

    <div class="footer-link">
        No account? <a href="/register.html">Create one</a>
    </div>
</div>

<!-- Telegram Login Modal -->
<div id="tg-widget-wrap">
    <div class="tg-modal">
        <h3>Telegram Login</h3>
        <p>Click the button below to authenticate with your Telegram account.</p>
        <div id="tg-widget-container"></div>
        <button class="tg-close" onclick="closeTelegramModal()">Cancel</button>
    </div>
</div>

<script src="/assets/auth.js"></script>
<script>
    // Redirect if already logged in
    if (Auth.getToken()) {
        window.location.href = "/";
    }

    const form      = document.getElementById("login-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorMsg  = document.getElementById("error-msg");

    function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add("visible");
    }

    function hideError() {
        errorMsg.classList.remove("visible");
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();

        const email    = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showError("Please enter email and password.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";

        try {
            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.detail || "Login failed.");
                return;
            }

            Auth.saveSession(data.access_token, data.user);
            window.location.href = "/";

        } catch (err) {
            showError("Network error. Please try again.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign in";
        }
    });

    // Telegram Widget
    function openTelegramModal() {
        document.getElementById("tg-widget-wrap").classList.add("open");
        loadTelegramWidget();
    }

    function closeTelegramModal() {
        document.getElementById("tg-widget-wrap").classList.remove("open");
    }

    function loadTelegramWidget() {
        const container = document.getElementById("tg-widget-container");
        if (container.querySelector("script")) return; // already loaded

        const script = document.createElement("script");
        script.src = "https://telegram.org/js/telegram-widget.js?22";
        script.setAttribute("data-telegram-login", getBotUsername());
        script.setAttribute("data-size", "large");
        script.setAttribute("data-onauth", "onTelegramAuth(user)");
        script.setAttribute("data-request-access", "write");
        container.appendChild(script);
    }

    function getBotUsername() {
        // Replace this with your actual bot username (without @)
        return window.TELEGRAM_BOT_USERNAME || "YourBotUsername";
    }

    async function onTelegramAuth(user) {
        closeTelegramModal();
        try {
            const res = await fetch("/api/auth/telegram", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(user),
            });

            const data = await res.json();

            if (!res.ok) {
                showError(data.detail || "Telegram login failed.");
                return;
            }

            Auth.saveSession(data.access_token, data.user);
            window.location.href = "/";
        } catch (err) {
            showError("Telegram login error. Please try again.");
        }
    }
</script>
</body>
</html>
