<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAF - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body { font-family: 'DM Sans', sans-serif; }

        .status-200 { background-color: #e6f9f0; color: #0f9d58; }
        .status-403 { background-color: #fff4e5; color: #f57c00; }
        .status-500 { background-color: #fdecea; color: #d93025; }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        .table-responsive { overflow-x: auto; overflow-y: visible; }
    </style>
</head>

<body>
<div class="container-fluid">

    <!-- Sidebar injected by Auth.renderShell -->

    <div class="main">
        <div class="content">
            <h1 class="mb-4">Live Dashboard</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Total Events</div>
                    <div id="total-events" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Blocked</div>
                    <div id="blocked-count" class="stat-value text-danger">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Allowed</div>
                    <div id="allowed-count" class="stat-value text-success">0</div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body d-flex gap-3 flex-wrap align-items-center">
                    <div>
                        <label class="form-label fw-semibold">Limit</label>
                        <select id="limit-select" class="form-select">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="25">25</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label fw-semibold">Status</label>
                        <select id="status-filter" class="form-select">
                            <option value="">All</option>
                            <option value="200">Allow (200)</option>
                            <option value="403">Blocked (403)</option>
                            <option value="500">Server Error (500+)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Time</th>
                                    <th>IP</th>
                                    <th>Method</th>
                                    <th>URI</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="live-logs-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="/assets/auth.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        Auth.renderShell("dashboard");
    });
</script>
<script src="/assets/dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
