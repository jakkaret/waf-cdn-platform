<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAF – CDN Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #f5f7fa; }
        .content { padding: 30px; }

        /* ── Page header ── */
        .page-hd h1 { font-size: 22px; font-weight: 700; color: #2d3748; margin: 0; }
        .page-hd p  { color: #a0aec0; font-size: 13px; margin: 4px 0 18px; }

        /* ── Global summary bar ── */
        .global-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }
        .gcard {
            background: white; border-radius: 14px;
            padding: 18px 20px; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .gcard-label { font-size: 11.5px; color: #a0aec0; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.4px; }
        .gcard-value { font-size: 30px; font-weight: 700; color: #2d3748;
            margin-top: 4px; line-height: 1.1; }
        .gcard-value.green  { color: #38a169; }
        .gcard-value.orange { color: #dd6b20; }
        .gcard-value.blue   { color: #3182ce; }

        /* ── Hit rate gauge label ── */
        .hit-gauge { position: relative; display: inline-block; }

        /* ── Nodes grid ── */
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .node-card {
            background: white; border-radius: 14px;
            padding: 20px 22px; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            border-left: 4px solid #e2e8f0;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .node-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
        .node-card.online  { border-left-color: #38a169; }
        .node-card.offline { border-left-color: #e53e3e; opacity: 0.75; }

        .node-top {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .node-flag { font-size: 26px; }
        .node-info { flex: 1; margin-left: 12px; }
        .node-name  { font-size: 15px; font-weight: 700; color: #2d3748; }
        .node-region { font-size: 11.5px; color: #a0aec0; }

        .node-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600;
        }
        .badge-online  { background: #e6f9f0; color: #276749; }
        .badge-offline { background: #fff5f5; color: #c53030; }

        /* Hit/Miss bar */
        .hm-bar-wrap { margin-bottom: 10px; }
        .hm-label {
            display: flex; justify-content: space-between;
            font-size: 11.5px; color: #718096; margin-bottom: 5px;
        }
        .hm-bar {
            height: 8px; border-radius: 4px; background: #edf2f7;
            overflow: hidden;
        }
        .hm-fill {
            height: 100%; border-radius: 4px;
            background: linear-gradient(90deg, #38a169, #68d391);
            transition: width 0.6s ease;
        }

        .node-stats {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 6px; margin-top: 12px;
        }
        .ns-item { text-align: center; }
        .ns-val  { font-size: 18px; font-weight: 700; color: #2d3748; }
        .ns-key  { font-size: 10.5px; color: #a0aec0; text-transform: uppercase; font-weight: 600; }

        .node-resp {
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid #f0f4f8;
            display: flex; justify-content: space-between;
            font-size: 11.5px; color: #718096;
        }
        .resp-val { color: #2d3748; font-weight: 600; }

        /* ── Charts section ── */
        .charts-row {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 18px; margin-bottom: 28px;
        }
        @media (max-width: 860px) { .charts-row { grid-template-columns: 1fr; } }

        .chart-card {
            background: white; border-radius: 14px;
            padding: 20px 22px; box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .chart-title { font-size: 14px; font-weight: 700; color: #2d3748; margin-bottom: 4px; }
        .chart-sub   { font-size: 12px; color: #a0aec0; margin-bottom: 16px; }
        .chart-wrap  { position: relative; height: 220px; }

        /* ── Cache status legend ── */
        .legend-row {
            display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px;
        }
        .legend-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: #4a5568;
        }
        .legend-dot {
            width: 10px; height: 10px; border-radius: 50%;
        }

        /* ── Refresh ── */
        .btn-refresh {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; background: white;
            border: 1px solid #e2e8f0; border-radius: 8px;
            font-size: 12.5px; cursor: pointer;
            font-family: 'DM Sans', sans-serif; color: #4a5568;
            transition: background 0.15s;
        }
        .btn-refresh:hover { background: #f7fafc; }
        .btn-refresh svg { width: 13px; height: 13px; }

        .loading { color: #a0aec0; font-size: 13px; text-align: center; padding: 30px; }
    </style>
</head>
<body>
<div style="display:flex;">
    <div class="main" style="flex:1;">
        <div class="content">

            <div class="page-hd" style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
                <div>
                    <h1>CDN Monitoring</h1>
                    <p>Real-time cache hit/miss across all edge nodes — Phase 1</p>
                </div>
                <button class="btn-refresh" onclick="loadAll()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-.08-7.94"/>
                    </svg>
                    Refresh
                </button>
            </div>

            <!-- Global summary -->
            <div class="global-bar" id="global-bar">
                <div class="loading">Loading…</div>
            </div>

            <!-- Edge nodes -->
            <h3 style="font-size:14px;font-weight:700;color:#4a5568;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.5px;">
                Edge Nodes
            </h3>
            <div class="nodes-grid" id="nodes-grid">
                <div class="loading">Loading edge nodes…</div>
            </div>

            <!-- Charts -->
            <div class="charts-row">
                <div class="chart-card">
                    <div class="chart-title">Cache Hit Rate by Region</div>
                    <div class="chart-sub">Percentage of requests served from cache</div>
                    <div class="chart-wrap">
                        <canvas id="hitRateChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">Cache Status Distribution</div>
                    <div class="chart-sub">HIT / MISS / BYPASS breakdown (global)</div>
                    <div class="chart-wrap">
                        <canvas id="statusPieChart"></canvas>
                    </div>
                    <div class="legend-row" id="pie-legend"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="/assets/auth.js"></script>
<script>
    let _hitChart = null;
    let _pieChart = null;

    document.addEventListener("DOMContentLoaded", () => {
        Auth.renderShell("cdn");
        loadAll();
        setInterval(loadAll, 15000);
    });

    async function loadAll() {
        try {
            const res = await Auth.apiFetch("/api/cdn/stats");
            if (!res || !res.ok) return;
            const data = await res.json();
            renderGlobal(data.summary, data.global);
            renderNodes(data.nodes);
            renderCharts(data.nodes, data.global);
        } catch (e) {
            console.error("CDN stats error:", e);
        }
    }

    function renderGlobal(summary, global) {
        document.getElementById("global-bar").innerHTML = `
            <div class="gcard">
                <div class="gcard-label">Edge Nodes</div>
                <div class="gcard-value blue">${summary.total_edge_nodes}</div>
            </div>
            <div class="gcard">
                <div class="gcard-label">Global Hit Rate</div>
                <div class="gcard-value green">${summary.global_hit_rate_pct}%</div>
            </div>
            <div class="gcard">
                <div class="gcard-label">Total Requests</div>
                <div class="gcard-value">${summary.total_requests.toLocaleString()}</div>
            </div>
            <div class="gcard">
                <div class="gcard-label">Global Miss Rate</div>
                <div class="gcard-value orange">${summary.global_miss_rate_pct}%</div>
            </div>
            <div class="gcard">
                <div class="gcard-label">4xx Errors</div>
                <div class="gcard-value orange">${global.status_4xx || 0}</div>
            </div>
            <div class="gcard">
                <div class="gcard-label">5xx Errors</div>
                <div class="gcard-value ${(global.status_5xx||0) > 0 ? 'orange' : ''}">${global.status_5xx || 0}</div>
            </div>
        `;
    }

    function renderNodes(nodes) {
        if (!nodes || nodes.length === 0) {
            document.getElementById("nodes-grid").innerHTML =
                '<div class="loading">No edge nodes found</div>';
            return;
        }
        document.getElementById("nodes-grid").innerHTML = nodes.map(n => {
            const online = n.status !== "offline";
            const hitRate = n.hit_rate_pct || 0;
            const fillW = Math.min(hitRate, 100);
            return `
            <div class="node-card ${online ? 'online' : 'offline'}">
                <div class="node-top">
                    <div style="display:flex;align-items:center;">
                        <div class="node-flag">${n.flag || '🌐'}</div>
                        <div class="node-info">
                            <div class="node-name">${n.name || n.region}</div>
                            <div class="node-region">Port :${n.port || '-'} · ${n.region}</div>
                        </div>
                    </div>
                    <span class="node-badge ${online ? 'badge-online' : 'badge-offline'}">
                        ${online ? '● Online' : '○ Offline'}
                    </span>
                </div>

                <div class="hm-bar-wrap">
                    <div class="hm-label">
                        <span>Cache Hit Rate</span>
                        <span style="font-weight:700;color:#38a169;">${hitRate}%</span>
                    </div>
                    <div class="hm-bar">
                        <div class="hm-fill" style="width:${fillW}%;"></div>
                    </div>
                </div>

                <div class="node-stats">
                    <div class="ns-item">
                        <div class="ns-val" style="color:#38a169;">${n.hit || 0}</div>
                        <div class="ns-key">HIT</div>
                    </div>
                    <div class="ns-item">
                        <div class="ns-val" style="color:#e53e3e;">${n.miss || 0}</div>
                        <div class="ns-key">MISS</div>
                    </div>
                    <div class="ns-item">
                        <div class="ns-val" style="color:#718096;">${n.bypass || 0}</div>
                        <div class="ns-key">BYPASS</div>
                    </div>
                </div>

                <div class="node-resp">
                    <span>Avg Response</span>
                    <span class="resp-val">${n.avg_response_time_ms || '-'} ms</span>
                </div>
            </div>`;
        }).join("");
    }

    function renderCharts(nodes, global) {
        // ── Bar: Hit rate per region ──
        const labels  = nodes.map(n => `${n.flag} ${n.region}`);
        const hitData = nodes.map(n => n.hit_rate_pct || 0);

        if (_hitChart) _hitChart.destroy();
        _hitChart = new Chart(
            document.getElementById("hitRateChart").getContext("2d"), {
            type: "bar",
            data: {
                labels,
                datasets: [{
                    label: "Hit Rate %",
                    data: hitData,
                    backgroundColor: "rgba(56,161,105,0.7)",
                    borderColor:     "#38a169",
                    borderWidth: 1.5,
                    borderRadius: 6,
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, max: 100,
                         ticks: { callback: v => v + "%" } }
                }
            }
        });

        // ── Pie: HIT/MISS/BYPASS/EXPIRED ──
        const pieData   = [global.hit||0, global.miss||0, global.bypass||0, global.expired||0];
        const pieLabels = ["HIT","MISS","BYPASS","EXPIRED"];
        const pieColors = ["#38a169","#e53e3e","#718096","#dd6b20"];

        if (_pieChart) _pieChart.destroy();
        _pieChart = new Chart(
            document.getElementById("statusPieChart").getContext("2d"), {
            type: "doughnut",
            data: {
                labels: pieLabels,
                datasets: [{
                    data: pieData,
                    backgroundColor: pieColors.map(c => c + "cc"),
                    borderColor:     pieColors,
                    borderWidth: 1.5,
                    hoverOffset: 6,
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                cutout: "62%",
                plugins: { legend: { display: false } }
            }
        });

        // Legend
        document.getElementById("pie-legend").innerHTML = pieLabels.map((l, i) => `
            <div class="legend-item">
                <div class="legend-dot" style="background:${pieColors[i]};"></div>
                ${l}: ${pieData[i].toLocaleString()}
            </div>`).join("");
    }
</script>
</body>
</html>
