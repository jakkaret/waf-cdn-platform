<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAF - Attack Logs</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body { font-family: 'DM Sans', sans-serif; }

        .content { padding: 30px; }

        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 24px; font-weight: 700; color: #2d3748; }
        .page-header p  { color: #718096; font-size: 14px; margin-top: 4px; }

        .logs-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 13px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13.5px; }
        th { background: #f7fafc; color: #4a5568; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
        tr:hover td { background: #f7fafc; }

        .badge { padding: 3px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; }
        .badge-200 { background: #e6f9f0; color: #0f9d58; }
        .badge-403 { background: #fff4e5; color: #f57c00; }
        .badge-500 { background: #fdecea; color: #d93025; }
        .badge-default { background: #edf2f7; color: #4a5568; }

        .mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    </style>
</head>
<body>
<div style="display:flex;">

    <!-- Sidebar injected by Auth.renderShell -->

    <div class="main" style="flex:1;">
        <div class="content">
            <div class="page-header">
                <h1>Attack Logs</h1>
                <p>Recent WAF log events from DynamoDB</p>
            </div>

            <div class="logs-card">
                <table id="logs-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>IP</th>
                            <th>Method</th>
                            <th>URL / Request</th>
                            <th>Status</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="logs-body">
                        <tr><td colspan="6" style="text-align:center;padding:40px;color:#a0aec0;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="/assets/auth.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        Auth.renderShell("logs");
        loadLogs();
    });

    async function loadLogs() {
        const res = await Auth.apiFetch("/api/logs/recent?limit=25");
        if (!res) return;

        const data  = await res.json();
        const tbody = document.getElementById("logs-body");
        tbody.innerHTML = "";

        const logs = data.logs || [];
        if (logs.length === 0) {
            tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;padding:40px;color:#a0aec0;'>No logs found</td></tr>";
            return;
        }

        logs.forEach(log => {
            const status = log.status || log.transaction?.response?.http_code || "-";
            const ip     = log.ip || log.remote_addr || log.transaction?.client_ip || "-";
            const method = log.method || log.transaction?.request?.method || "-";
            const url    = log.request || log.transaction?.request?.uri || "-";
            const ts     = log.time_local || log.timestamp || "-";
            const userId = log.user_id || "-";

            let badgeClass = "badge-default";
            if (String(status) === "200") badgeClass = "badge-200";
            if (String(status) === "403") badgeClass = "badge-403";
            if (String(status).startsWith("5")) badgeClass = "badge-500";

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="mono">${userId}</td>
                <td class="mono">${ip}</td>
                <td>${method}</td>
                <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${url}">${url}</td>
                <td><span class="badge ${badgeClass}">${status}</span></td>
                <td class="mono" style="font-size:11px;">${ts}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>
</body>
</html>
