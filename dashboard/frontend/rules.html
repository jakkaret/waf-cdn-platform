            </nav>
        </div>
        
        <!-- Main Content -->
        <div class="main">
            <div class="header">
                <h1>⚙️ จัดการกฎ (Custom Rules)</h1>
                <button class="btn btn-primary" onclick="openCreateModal()">
                    ➕ เพิ่มกฎใหม่
                </button>
            </div>
            
            <div class="rules-table">
                <table id="rulesTable">
                    <thead>
                        <tr>
                            <th>Rule ID</th>
                            <th>Variable</th>
                            <th>Operator</th>
                            <th>Severity</th>
                            <th>Message</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- ข้อมูลจะโหลดจาก API -->
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Modal สำหรับเพิ่ม Rule -->
    <div class="modal" id="ruleModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">เพิ่มกฎใหม่</h2>
            <form id="ruleForm">
                <input type="hidden" name="mode" value="create">
                <div class="form-group">
                    <label>Rule ID</label>
                    <input type="text" name="id" required placeholder="เช่น 999001">
                </div>
                
                <div class="form-group">
                    <label>Variable</label>
                    <select name="variable">
                        <option value="REQUEST_URI">REQUEST_URI</option>
                        <option value="ARGS">ARGS</option>
                        <option value="REQUEST_HEADERS">REQUEST_HEADERS</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Operator (Pattern)</label>
                    <input type="text" name="operator" required placeholder="เช่น @rx .*admin.*">
                </div>
                
                <div class="form-group">
                    <label>Severity</label>
                    <select name="severity">
                        <option value="CRITICAL">Critical</option>
                        <option value="HIGH">High</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="LOW">Low</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" required placeholder="คำอธิบายกฎนี้"></textarea>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">บันทึก</button>
                    <button type="button" class="btn" onclick="closeModal()">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // โหลดข้อมูล Rules
        async function loadRules() {
            try {
                console.log('กำลังโหลดข้อมูล...');
                
                const res = await fetch('/api/rules/');

                console.log('Response status:', res.status);
                
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                
                const data = await res.json();
                console.log('ข้อมูลที่ได้:', data);
                console.log('จำนวน rules:', data.rules.length);
                
                const tbody = document.querySelector('#rulesTable tbody');
                tbody.innerHTML = '';
                
                if (!data.rules || data.rules.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">ยังไม่มี Rules</td></tr>';
                    return;
                }
                
                data.rules.forEach((rule, index) => {
                    console.log(`Rule ${index}:`, rule);
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${rule.id || 'N/A'}</td>
                        <td>${rule.variable || 'N/A'}</td>
                        <td>${rule.operator || 'N/A'}</td>
                        <td><span class="severity ${(rule.severity || 'medium').toLowerCase()}">${severityBadge(rule.severity || 'N/A')}</span></td>
                        <td>${rule.message || 'N/A'}</td>
                        <td class="actions">
                            <button class="btn-edit" data-rule='${JSON.stringify(rule)}'>แก้ไข</button>
                            <button class="btn-delete" data-id="${rule.id}">ลบ</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                
                // เพิ่ม Event Listeners หลังจากสร้าง DOM
                document.querySelectorAll('.btn-edit').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const ruleData = JSON.parse(this.getAttribute('data-rule'));
                        editRule(ruleData);
                    });
                });
                
                document.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const ruleId = this.getAttribute('data-id');
                        deleteRule(ruleId);
                    });
                });
                
                console.log('โหลดเสร็จสิ้น');
                
            } catch (error) {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาด: ' + error.message);
                
                const tbody = document.querySelector('#rulesTable tbody');
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:red;">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }
        
        // เพิ่ม Rule
        document.getElementById('ruleForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            let url = '/api/rules/';
            let method = 'POST';

            if (data.mode === 'edit') {
                url = `/api/rules/${editingRuleId}`;
                method = 'PUT';
                delete data.id; // PUT ไม่ควรส่ง id
            }

            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            closeModal();
            loadRules();
        });

        
        // ลบ Rule
        async function deleteRule(id) {
            if (confirm('ต้องการลบกฎนี้?')) {
                await fetch(`/api/rules/${id}`, { method: 'DELETE' });
                loadRules();
            }
        }

        
        function openModal() {
            document.getElementById('ruleModal').classList.add('active');
        }


        
        function closeModal() {
            document.getElementById('ruleModal').classList.remove('active');
        }
        
        function openCreateModal() {
            const form = document.getElementById('ruleForm');
            form.reset();
            form.mode.value = 'create';
            form.id.disabled = false; // เปิดการแก้ไข ID
            editingRuleId = null;

            document.querySelector('#ruleModal h2').innerText = 'เพิ่มกฎใหม่';
            openModal();
        }


        function severityBadge(sev) {
            // เปลี่ยน severity เป็น badge
            const map = {
                CRITICAL: "badge-danger",
                HIGH: "badge-warning",
                MEDIUM: "badge-info",
                LOW: "badge-secondary"
            };
            return `<span class="badge ${map[sev] || 'badge-light'}">${sev}</span>`;
        }

        // เปิดแก้ไข Rule
        
        let editingRuleId = null;

        function editRule(ruleData) {
            console.log('Edit Rule:', ruleData);
            
            editingRuleId = ruleData.id;

            const form = document.getElementById('ruleForm');

            form.mode.value = 'edit';
            form.id.value = ruleData.id;
            form.id.disabled = true;  // ปิดการแก้ไข ID
            form.variable.value = ruleData.variable;   
            form.operator.value = ruleData.operator;
            form.severity.value = ruleData.severity;
            form.message.value = ruleData.message;

            document.querySelector('#ruleModal h2').innerText = 'แก้ไขกฎ';
            openModal(); 
        }


        // โหลดข้อมูลตอน page load
        loadRules();
    </script>
</body>
