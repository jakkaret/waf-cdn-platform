# Combined captcha+OTP gate. nginx's auth_request module only recognizes
# 401/403 as failure statuses it can map via error_page -- anything else
# (tried 418 first) triggers its own "unexpected status" handling and
# returns 500 instead of redirecting. 403 is taken by ModSecurity's own
# `deny,status:403` blocks, so both shields share 401 here and let
# control-api (otp_engine.shield_access) decide FOR nginx which one failed,
# tagged on X-Shield-Type. See default.conf.template for how that header
# is captured (auth_request_set) and re-forwarded to the challenge route.
location = /internal-shield-check {
    internal;
    auth_request /internal-rate-limit;
    auth_request_set $retry_after $upstream_http_retry_after;
    proxy_method GET;
    proxy_pass http://control-api:8070/api/shield/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Original-IP $remote_addr;
    proxy_set_header X-Original-User-Agent $http_user_agent;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
