# ============================================================
# CACHE POLICY CONFIGURATION
# Phase 1 – งาน: Cache policy  (label: ริว)
#
# ไฟล์นี้ include เข้า nginx.conf ของทุก edge node
# เปลี่ยนที่นี่ที่เดียว มีผลกับทุก region
# ============================================================


# ──────────────────────────────────────────────────────────
# SECTION 1: CACHE BYPASS CONDITIONS
# กำหนดเงื่อนไขที่ "ห้าม cache" เลย
# ──────────────────────────────────────────────────────────

# 1a. Bypass ถ้ามี Cookie ที่บ่งชี้ว่า user login แล้ว
#     (session cookie ของ DVWA)
map $http_cookie $bypass_for_session {
    default          0;
    ~*PHPSESSID      1;   # PHP session → dynamic content
    ~*security=high  1;   # DVWA security level
}

# 1b. Bypass ถ้า request มี Authorization header (API call)
map $http_authorization $bypass_for_auth {
    default  0;
    ~*.+     1;   # มี auth header → ไม่ cache
}

# 1c. Bypass สำหรับ method ที่ไม่ใช่ GET/HEAD
map $request_method $bypass_for_method {
    default 1;   # POST PUT PATCH DELETE → ไม่ cache
    GET     0;
    HEAD    0;
}

# 1d. Bypass ถ้า client ส่ง Cache-Control: no-cache
#     (เช่น Shift+Reload ใน browser)
map $http_cache_control $bypass_for_pragma {
    default 0;
    ~*no-cache 1;
    ~*no-store 1;
}

# รวม bypass conditions ทั้งหมด
# ถ้า any of them = 1 → ไม่ cache
map "$bypass_for_session$bypass_for_auth$bypass_for_method$bypass_for_pragma" $cache_bypass {
    default  0;
    ~*1      1;
}


# ──────────────────────────────────────────────────────────
# SECTION 2: CONTENT TYPE → CACHE TTL MAP
# กำหนด TTL ตาม Content-Type ที่ได้รับจาก origin
# ──────────────────────────────────────────────────────────

map $upstream_http_content_type $cache_ttl {
    default                          "5m";     # fallback

    # Static assets – cache นาน
    ~*image/                         "30d";    # รูปภาพ
    ~*font/                          "1y";     # Fonts
    ~*text/css                       "7d";     # CSS
    ~*application/javascript         "7d";     # JS
    ~*application/x-javascript       "7d";

    # HTML – cache สั้น (เปลี่ยนบ่อย)
    ~*text/html                      "5m";

    # API / JSON – ไม่ cache
    ~*application/json               "0";
    ~*application/xml                "0";

    # ไฟล์ download – cache นานพอควร
    ~*application/pdf                "1d";
    ~*application/zip                "1d";
}


# ──────────────────────────────────────────────────────────
# SECTION 3: URL PATTERN → CACHE POLICY
# ──────────────────────────────────────────────────────────

# กำหนด cache zone ตาม URL pattern
# ใช้ใน location block ผ่าน $cache_zone variable
map $request_uri $cache_zone_name {
    default             "EDGE";                    # HTML pages
    ~*\.(jpg|jpeg|png|gif|ico|webp|svg)$  "STATIC_IMG";   # รูป
    ~*\.(css|js|woff2?|ttf|eot)$          "STATIC_ASSET"; # assets
    ~*^/(api|login|logout|setup)          "NOCACHE";       # API
    ~*\?.*                                "NOCACHE";       # Query string → bypass
}


# ──────────────────────────────────────────────────────────
# SECTION 4: STALE-WHILE-REVALIDATE BEHAVIOR
# เมื่อ cache หมดอายุ ให้ serve ของเก่าไปก่อนขณะ refetch
# ──────────────────────────────────────────────────────────
#
# proxy_cache_use_stale ถูก set ใน location block แล้ว
# ตรงนี้เป็น global เพิ่มเติม:

proxy_cache_background_update on;   # refetch background
proxy_cache_lock on;                 # ป้องกัน thundering herd
proxy_cache_lock_timeout 5s;
proxy_cache_revalidate on;           # If-Modified-Since เมื่อ stale


# ──────────────────────────────────────────────────────────
# SECTION 5: CACHE KEY NORMALIZATION
# ปรับ key ให้ไม่นับ parameter ที่ไม่สำคัญ
# (เช่น utm_source, fbclid → cache เดียวกัน)
# ──────────────────────────────────────────────────────────

# ลบ tracking params ออกจาก cache key
map $args $normalized_args {
    default $args;
    ~*(?:^|&)(utm_[^&]*)   "";   # ตัด utm_*
    ~*(?:^|&)(fbclid[^&]*) "";   # ตัด fbclid
    ~*(?:^|&)(gclid[^&]*)  "";   # ตัด gclid
}


# ──────────────────────────────────────────────────────────
# SECTION 6: RESPONSE HEADERS ที่ส่งไป Client
# ──────────────────────────────────────────────────────────
#
# X-Cache-Status: HIT | MISS | BYPASS | EXPIRED | STALE
#   → ดูได้ใน dashboard ว่า cache ทำงานถูกไหม
#
# หมายเหตุ: add_header ถูก set ใน location block แต่ละ node
#            เพื่อให้ region name ถูกต้อง


# ──────────────────────────────────────────────────────────
# SECTION 7: PURGE ENDPOINT PLACEHOLDER
# (Phase 1 – บอสทำส่วนนี้, ริวทำ policy ด้านบน)
# ──────────────────────────────────────────────────────────
#
# สำหรับ cache purge ใช้ผ่าน script:
#   ./scripts/purge-cache.sh <node> <uri>
# ดูไฟล์ scripts/purge-cache.sh
